
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>MLBB Assistant</title>
<style>
:root {
  --bg:#090d18; --panel:#121a2b; --line:#26334b;
  --text:#f4f6ff; --muted:#9ba9c2; --blue:#6595ff;
  --purple:#9c7bff; --green:#39d6a0;
}
* {box-sizing:border-box}
body {
  margin:0; min-height:100vh; padding:25px 15px;
  background:radial-gradient(ellipse at top,#172849 0%,var(--bg) 58%);
  color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.container {max-width:650px;margin:auto}
header {text-align:center;padding:15px 0 25px}
.logo {font-size:38px;margin-bottom:8px}
h1 {font-size:27px;margin:0 0 9px}
header p {color:var(--muted);font-size:14px;margin:0}
.panel {
  background:rgba(18,26,43,.96); border:1px solid var(--line);
  border-radius:19px;padding:19px;margin-bottom:15px;
  box-shadow:0 12px 35px #0003;
}
.section-title {font-size:16px;font-weight:750;margin:0 0 15px}
label {display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
select {
  width:100%;height:48px;border:1px solid var(--line);
  background:#0b1221;color:var(--text);border-radius:11px;
  padding:0 12px;font-size:14px;outline:none;
}
select:focus {border-color:var(--blue)}
.field {margin-bottom:16px}
.enemy-grid {display:grid;grid-template-columns:1fr 1fr;gap:12px}
.enemy-grid .field {margin:0}
.enemy-grid .field:last-child {grid-column:1/-1}
button {
  width:100%;border:0;border-radius:12px;padding:15px;
  font-size:16px;font-weight:800;color:white;cursor:pointer;
  background:linear-gradient(110deg,#477cf2,#9069ed);
  margin-top:17px;
}
button:disabled {opacity:.55;cursor:wait}
.status {color:var(--muted);text-align:center;font-size:13px;margin-top:13px}
.error {color:#ff8585}
.result {display:none}
.result h2 {font-size:17px;margin:0 0 15px}
.picks {display:grid;gap:10px}
.pick {
  background:#0c1525;border:1px solid #34466a;
  border-radius:12px;padding:15px;text-align:center;
  font-size:18px;font-weight:800;
}
.footer {text-align:center;color:#72819c;font-size:11px;margin:22px 0}
@media(max-width:420px) {
  .enemy-grid {grid-template-columns:1fr}
  .enemy-grid .field:last-child {grid-column:auto}
  .panel {padding:15px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">⚔️</div>
  <h1>MLBB Assistant</h1>
  <p>اختر اللاين والخصوم، واعرف أفضل اختيارات الكاونتر</p>
</header>

<section class="panel">
  <h2 class="section-title">إعدادات المباراة</h2>
  <div class="field">
    <label for="lane">اللاين اللي بتلعب فيه</label>
    <select id="lane">
      <option value="exp">EXP Lane</option>
      <option value="gold">Gold Lane</option>
      <option value="mid">Mid Lane</option>
      <option value="jungle">Jungle</option>
      <option value="roam">Roam</option>
    </select>
  </div>
  <div class="field">
    <label for="rank">الرانك</label>
    <select id="rank">
      <option value="all">كل الرانكات</option>
      <option value="epic">Epic</option>
      <option value="legend">Legend</option>
      <option value="mythic">Mythic</option>
      <option value="honor">Mythical Honor</option>
      <option value="glory">Mythical Glory</option>
    </select>
  </div>
</section>

<section class="panel">
  <h2 class="section-title">أبطال الفريق الخصم</h2>
  <div class="enemy-grid">
    <div class="field"><label for="enemy1">الخصم الأول</label><select id="enemy1"><option value="">جاري تحميل الأبطال...</option></select></div>
    <div class="field"><label for="enemy2">الخصم الثاني</label><select id="enemy2"><option value="">اختر البطل</option></select></div>
    <div class="field"><label for="enemy3">الخصم الثالث</label><select id="enemy3"><option value="">اختر البطل</option></select></div>
    <div class="field"><label for="enemy4">الخصم الرابع</label><select id="enemy4"><option value="">اختر البطل</option></select></div>
    <div class="field"><label for="enemy5">الخصم الخامس</label><select id="enemy5"><option value="">اختر البطل</option></select></div>
  </div>
  <button id="recommend">رشّح لي أفضل 3 هيروات</button>
  <div id="status" class="status">جاري الاتصال بقاعدة بيانات الأبطال...</div>
</section>

<section id="result" class="panel result">
  <h2>أفضل 3 اختيارات لك</h2>
  <div id="picks" class="picks"></div>
</section>

<div class="footer">MLBB Assistant · بيانات إحصائية من Rone Arena API</div>
</div>

<script>
const API = "https://arena.fastapicloud.dev/api";
const FALLBACK_API = "https://arena.rone.dev/api";

let allHeroes = [];
let laneHeroes = [];
let heroMap = new Map();

const $ = id => document.getElementById(id);
const statusBox = $("status");

function setStatus(message, error=false) {
  statusBox.textContent = message;
  statusBox.className = error ? "status error" : "status";
}

async function request(path) {
  let lastError;
  for (const base of [API, FALLBACK_API]) {
    try {
      const response = await fetch(base + path);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const json = await response.json();
      if (json.code !== undefined && json.code !== 0) {
        throw new Error(json.message || "API error");
      }
      return json;
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError || new Error("تعذر الاتصال");
}

function recordsOf(json) {
  return json?.data?.records || json?.records || [];
}

function heroInfo(row) {
  const data = row?.data || row || {};
  const hero = data?.hero?.data || data?.hero || {};
  const name = hero?.name || data?.name;
  const id = data?.hero_id ?? hero?.heroid ?? data?.heroid;
  if (id == null || !name) return null;
  return { id:String(id), name:String(name) };
}

function fillSelect(select, heroes) {
  const previous = select.value;
  select.innerHTML = '<option value="">اختر البطل</option>';
  heroes.forEach(hero => {
    const option = document.createElement("option");
    option.value = hero.id;
    option.textContent = hero.name;
    select.appendChild(option);
  });
  if (heroes.some(h => h.id === previous)) select.value = previous;
}

async function loadHeroes() {
  try {
    const json = await request("/heroes/positions?size=200&index=1&lang=en");
    const rows = recordsOf(json);
    allHeroes = rows.map(heroInfo).filter(Boolean);

    // إزالة التكرار حسب رقم البطل
    const unique = new Map();
    allHeroes.forEach(h => unique.set(h.id, h));
    allHeroes = [...unique.values()].sort((a,b)=>a.name.localeCompare(b.name));

    if (!allHeroes.length) throw new Error("لم تصل قائمة الأبطال");

    allHeroes.forEach(h => heroMap.set(h.id, h));

    for (let i=1;i<=5;i++) {
      fillSelect($("enemy"+i), allHeroes);
    }
    setStatus("تم تحميل " + allHeroes.length + " بطل. اختر أبطال الخصم.");
  } catch (err) {
    setStatus("ما قدرت أحمل قائمة الأبطال. جرّب تحديث الصفحة. " + err.message, true);
  }
}

async function loadLaneHeroes(lane) {
  const json = await request(
    "/heroes/positions?lane=" + encodeURIComponent(lane) +
    "&size=200&index=1&lang=en"
  );
  const rows = recordsOf(json);
  const list = rows.map(heroInfo).filter(Boolean);
  const unique = new Map();
  list.forEach(h => unique.set(h.id, h));
  return [...unique.values()];
}

function getCounterRows(json) {
  const rows = recordsOf(json);
  const result = [];
  for (const row of rows) {
    const data = row?.data || row || {};
    const subs = data?.sub_hero || [];
    for (const sub of subs) {
      const id = sub?.heroid ?? sub?.hero_id;
      const value = Number(sub?.increase_win_rate);
      if (id != null && Number.isFinite(value)) {
        result.push({id:String(id), value});
      }
    }
  }
  return result;
}

async function recommend() {
  const button = $("recommend");
  const resultBox = $("result");
  resultBox.style.display = "none";

  const enemyIds = [];
  for (let i=1;i<=5;i++) {
    const value = $("enemy"+i).value;
    if (!value) {
      setStatus("اختر الأبطال الخمسة قبل الترشيح.", true);
      return;
    }
    enemyIds.push(value);
  }

  if (new Set(enemyIds).size !== 5) {
    setStatus("اختَر خمسة أبطال مختلفين، لا تكرر نفس البطل.", true);
    return;
  }

  button.disabled = true;
  button.textContent = "جاري تحليل المواجهات...";
  setStatus("جاري تحليل بيانات الخصوم والكاونترات...");

  try {
    const lane = $("lane").value;
    const rank = $("rank").value;

    laneHeroes = await loadLaneHeroes(lane);
    if (!laneHeroes.length) {
      throw new Error("ما وصلت بيانات أبطال هذا اللاين.");
    }

    const counterResponses = await Promise.all(
      enemyIds.map(id =>
        request("/heroes/" + encodeURIComponent(id) +
          "/counters?days=7&rank=" + encodeURIComponent(rank) +
          "&size=100&index=1&lang=en")
      )
    );

    // تجميع قوة الكاونتر لكل هيرو
    const scores = new Map();

    counterResponses.forEach((json, index) => {
      const counters = getCounterRows(json);
      const seen = new Set();

      counters.forEach(counter => {
        if (seen.has(counter.id)) return;
        seen.add(counter.id);

        if (!scores.has(counter.id)) {
          scores.set(counter.id, {total:0, matches:0});
        }
        const entry = scores.get(counter.id);
        entry.total += counter.value;
        entry.matches += 1;
      });
    });

    const enemySet = new Set(enemyIds);
    const allowed = new Set(laneHeroes.map(h=>h.id));

    const ranked = [...scores.entries()]
      .filter(([id, score]) =>
        allowed.has(id) && !enemySet.has(id) && score.matches > 0
      )
      .map(([id, score]) => {
        const hero = heroMap.get(id) ||
          laneHeroes.find(h=>h.id===id);
        return {
          name: hero?.name,
          score: score.total / score.matches,
          coverage: score.matches
        };
      })
      .filter(x=>x.name)
      .sort((a,b) =>
        b.coverage - a.coverage || b.score - a.score
      )
      .slice(0,3);

    if (ranked.length < 3) {
      throw new Error(
        "البيانات المتاحة ما تكفي لثلاثة ترشيحات في هذا اللاين والرانك. جرّب اختيار كل الرانكات."
      );
    }

    const picks = $("picks");
    picks.innerHTML = "";
    ranked.forEach(hero => {
      const item = document.createElement("div");
      item.className = "pick";
      item.textContent = hero.name;
      picks.appendChild(item);
    });

    resultBox.style.display = "block";
    setStatus("اكتمل التحليل. هذه أفضل الترشيحات حسب البيانات المتاحة.");
    resultBox.scrollIntoView({behavior:"smooth",block:"start"});

  } catch (err) {
    setStatus(
      "تعذر إكمال الترشيح: " + (err.message || "خطأ غير معروف") +
      " — تأكد من الاتصال وحاول مرة ثانية.",
      true
    );
  } finally {
    button.disabled = false;
    button.textContent = "رشّح لي أفضل 3 هيروات";
  }
}

$("recommend").addEventListener("click", recommend);
loadHeroes();
</script>
</body>
</html>
