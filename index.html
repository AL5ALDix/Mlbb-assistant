
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10121b">
<title>MLBB Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121b;color:#f5f5fa;font-family:Arial,sans-serif;padding:18px}
header{text-align:center;padding:25px 0}
h1{font-size:29px;color:#a99aff;margin:8px}
.sub{color:#999;font-size:13px}
.panel{background:#1b1e2b;border:1px solid #303448;border-radius:18px;padding:17px;margin:15px 0}
h2{font-size:19px;margin-top:0}
label{display:block;color:#bbb;font-size:13px;margin:13px 0 7px}
select{width:100%;background:#10121b;color:white;border:1px solid #42465b;padding:14px;border-radius:11px;font-size:15px}
button{background:#7664d9;color:white;border:0;padding:15px;border-radius:12px;font-size:15px;font-weight:bold;width:100%;margin-top:17px}
button:disabled{opacity:.5}
.result{background:#26233d;border-radius:13px;padding:15px;margin-top:15px;text-align:center}
.pick{font-size:18px;font-weight:bold;padding:13px;border-bottom:1px solid #393b4c}
.note{font-size:12px;color:#999;line-height:1.7;margin-top:12px}
.status{font-size:12px;color:#aaa;margin-top:10px}
</style>
</head>
<body>
<header>
<div style="font-size:38px">⚔️</div>
<h1>MLBB ASSISTANT</h1>
<div class="sub">SMART COUNTER PICK</div>
</header>

<div class="panel">
<h2>🎯 Counter Pick</h2>

<label>اختر اللاين الخاص فيك</label>
<select id="lane">
<option value="Exp">EXP Lane</option>
<option value="Gold">Gold Lane</option>
<option value="Mid">Mid Lane</option>
<option value="Jungle">Jungle</option>
<option value="Roam">Roam</option>
</select>

<div id="enemySelectors"></div>

<button id="analyze" onclick="analyze()">رشّح أفضل 3 هيروات</button>
<div id="result"></div>
<div class="status" id="status">جاري تحميل قائمة الهيروات...</div>
</div>

<script>
let heroes = [];

const laneRoles = {
 Exp:["Fighter","Tank"],
 Gold:["Marksman"],
 Mid:["Mage"],
 Jungle:["Assassin","Fighter"],
 Roam:["Tank","Support"]
};

async function loadHeroes(){
 const status=document.getElementById("status");
 try{
  const response=await fetch("https://mlbbdex.com/api/v1/heroes");
  if(!response.ok) throw new Error("API");
  const data=await response.json();
  const list=Array.isArray(data)?data:(data.data||data.heroes||[]);
  heroes=list.map(h=>({
   name:h.name||h.hero_name,
   role:h.role||"",
   lane:h.lane||""
  })).filter(h=>h.name);
  if(heroes.length<50) throw new Error("Incomplete roster");
  createSelectors();
  status.textContent="تم تحميل "+heroes.length+" هيرو";
 }catch(e){
  status.textContent="تعذر تحميل قائمة الهيروات. تأكد من اتصال الإنترنت.";
  document.getElementById("analyze").disabled=true;
 }
}

function createSelectors(){
 const area=document.getElementById("enemySelectors");
 area.innerHTML="";
 for(let i=1;i<=5;i++){
  const label=document.createElement("label");
  label.textContent="هيرو الخصم "+i;
  const select=document.createElement("select");
  select.className="enemy";
  select.innerHTML='<option value="">اختر الهيرو</option>'+
   heroes.map(h=>`<option value="${escapeHTML(h.name)}">${escapeHTML(h.name)}</option>`).join("");
  area.append(label,select);
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function analyze(){
 const lane=document.getElementById("lane").value;
 const enemies=[...document.querySelectorAll(".enemy")].map(x=>x.value);
 const result=document.getElementById("result");

 if(enemies.some(x=>!x)){
  result.innerHTML='<div class="result">اختر هيروات الخصم الخمسة أولاً.</div>';
  return;
 }

 const roles=laneRoles[lane]||[];
 const candidates=heroes.filter(h=>{
  const heroLane=String(h.lane).toLowerCase();
  const role=String(h.role).toLowerCase();
  return heroLane.includes(lane.toLowerCase()) ||
   roles.some(r=>role.includes(r.toLowerCase()));
 });

 const enemyRoles=enemies.map(name=>
  heroes.find(h=>h.name===name)?.role||""
 );

 const ranked=candidates.map(hero=>{
  let score=0;
  const role=String(hero.role).toLowerCase();

  enemyRoles.forEach(enemyRole=>{
   const enemy=String(enemyRole).toLowerCase();
   if(enemy.includes("marksman") && role.includes("assassin")) score+=2;
   if(enemy.includes("mage") && role.includes("assassin")) score+=1;
   if(enemy.includes("assassin") && role.includes("tank")) score+=2;
   if(enemy.includes("fighter") && role.includes("marksman")) score+=1;
   if(enemy.includes("tank") && role.includes("mage")) score+=1;
  });

  if(enemies.includes(hero.name)) score-=100;
  return {name:hero.name,score};
 });

 ranked.sort((a,b)=>b.score-a.score);
 const top=ranked.filter(h=>!enemies.includes(h.name)).slice(0,3);

 if(top.length<3){
  result.innerHTML='<div class="result">ما قدرت أطلع 3 ترشيحات لهذا اللاين.</div>';
  return;
 }

 result.innerHTML='<div class="result">'+
  top.map(h=>`<div class="pick">${escapeHTML(h.name)}</div>`).join("")+
  '</div>';
}

loadHeroes();
</script>
</body>
</html>
